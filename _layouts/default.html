<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #0066cc; --rule: #d2d2d7;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --link: #2997ff; --rule: #424245; }
    }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    header, main, footer { max-width: 44rem; margin: 0 auto; padding: 0 1rem; }
    header { padding-top: 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); }
    header a { color: var(--fg); font-weight: 600; text-decoration: none; }
    main { padding-top: 0.5rem; padding-bottom: 2rem; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 1.25rem 0 0.75rem; }
    h2 { font-size: 1.35rem; margin: 2rem 0 0.5rem; }
    h3 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
    a { color: var(--link); }
    li { margin: 0.35rem 0; }
    address { font-style: normal; }
    footer { padding-top: 1rem; padding-bottom: 2rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.9rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">GPS Speed</a></header>
  <main>
{{ content }}
  </main>
  <footer>
    © 2026 smartlevel GmbH ·
    <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a> ·
    <a href="mailto:info@smartlevel.ch">info@smartlevel.ch</a>
  </footer>
</body>
</html>
